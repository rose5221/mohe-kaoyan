<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1ea">
  <meta name="description" content="按科目和章节练习单选、多选和材料分析题。">
  <title>肖1000 · 考研政治</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="quiz.css?v=map-2">
  <script defer src="questions.js?v=53"></script>
  <script defer src="quiz.js?v=53"></script>
</head>
<body>
  <div id="scene-transition" class="scene-transition" popover="manual" aria-hidden="true" hidden>
    <i></i><i></i><i></i><i></i>
  </div>
  <header id="quiz-header" class="masthead" hidden>
    <div class="masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>肖1000</div>
      <div class="masthead-tools">
        <button id="map-open" class="map-button" type="button" aria-controls="campaign-map">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 17h18M3 6v2m6-2v2m6-2v2m6-2v2M3 16v2m6-2v2m6-2v2m6-2v2"/></svg>
          返回关卡地图
        </button>
        <button id="sound" type="button" class="sound-button" title="答题音效" aria-label="答题音效" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="sound-wave" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/><path class="sound-mute" d="m16 10 4 4m0-4-4 4"/></svg>
        </button>
      </div>
    </div>
  </header>
  <noscript><p>请启用浏览器的 JavaScript 后开始答题。</p></noscript>
  <p id="load-error" role="alert" hidden>题目加载失败。请将网页和同目录的脚本、样式一起保留后重新打开。</p>
  <main id="quiz-workspace" class="workspace" hidden>
    <header class="page-head">
      <div class="page-titles">
        <h1>考研政治练习卷</h1>
        <p id="subject-title">考研政治题库</p>
      </div>
      <div class="stage-hud" id="stage-hud" hidden>
        <div class="stage-title"><span id="stage-index"></span><strong id="stage-name"></strong></div>
        <div class="progress-label"><span>答题进度</span><strong id="progress-label">0</strong></div>
        <progress id="progress" max="1" value="0" aria-label="当前练习进度"></progress>
        <button id="recap-open" type="button" class="recap-link" hidden>查看本关战绩</button>
      </div>
    </header>
    <div id="practice" class="practice" hidden>
      <div class="paper-tools">
        <div class="practice-modes" role="group" aria-label="练习模式">
          <button id="mode-single" type="button" aria-pressed="true">逐题</button>
          <button id="mode-exam" type="button" aria-pressed="false">整卷</button>
        </div>
        <details class="scope-tools">
          <summary>筛选题库</summary>
          <nav id="catalog" class="catalog" aria-label="题库范围" hidden>
            <label>科目<select id="subject-select"></select></label>
            <label>章节<select id="chapter-select"></select></label>
            <label>题型<select id="type-select"></select></label>
          </nav>
        </details>
      </div>
      <article id="paper" class="paper" aria-labelledby="question-title">
        <div class="paper-head">
          <div class="question-index">
            <span id="ordinal" class="ordinal" aria-hidden="true"></span>
            <div>
              <h2 id="question-title" tabindex="-1"></h2>
              <p id="chapter"></p>
            </div>
          </div>
          <button id="mark" class="paper-button" type="button" aria-pressed="false">标记复习</button>
        </div>
        <p id="stem" class="stem"></p>
        <ol id="statements" class="statements" hidden></ol>
        <fieldset id="choices" class="choices">
          <legend id="choice-label"></legend>
          <div id="options" class="options"></div>
        </fieldset>
        <label id="written-area" class="written-area" hidden>
          作答要点
          <textarea id="written-draft" rows="6" maxlength="12000" placeholder="写下你的答题要点"></textarea>
        </label>
        <section id="feedback" class="feedback" aria-labelledby="feedback-heading" hidden>
          <div class="feedback-head">
            <span id="result-mark" class="result-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
            </span>
            <h3 id="feedback-heading" tabindex="-1"></h3>
          </div>
          <p id="answer-summary"></p>
          <div id="analysis-text" class="analysis-text"></div>
          <p id="source" class="source"></p>
        </section>
      </article>
      <article id="full-exam" class="paper full-exam" aria-labelledby="exam-title" hidden>
        <header class="exam-cover">
          <div>
            <h2 id="exam-title" tabindex="-1">整卷练习</h2>
            <p id="exam-scope"></p>
            <p id="exam-instruction">完成作答后统一交卷，再查看答案和解析。</p>
          </div>
          <span id="exam-page-label" class="exam-page-label"></span>
        </header>
        <section id="exam-result" class="exam-result" aria-label="交卷结果" hidden>
          <strong id="exam-score" tabindex="-1"></strong>
          <p id="exam-score-note"></p>
        </section>
        <h3 id="exam-section" class="exam-section" tabindex="-1"></h3>
        <p id="exam-section-note" class="exam-section-note"></p>
        <ol id="exam-items" class="exam-items"></ol>
        <nav id="exam-paper-pages" class="exam-paper-pages" aria-label="试卷页码"></nav>
      </article>
    </div>
  </main>
  <section id="campaign-map" aria-labelledby="map-title" hidden>
    <div class="map-body">
      <div class="map-board">
        <div class="map-landscape" aria-hidden="true"></div>
        <div class="map-atmosphere" aria-hidden="true">
          <i class="map-mist"></i><i class="map-mist"></i>
          <i class="map-glint"></i><i class="map-glint"></i><i class="map-glint"></i>
        </div>
        <div class="map-hud">
          <header class="dialog-head">
            <div class="map-heading">
              <a id="map-books" class="map-books" href="index.html" aria-label="返回选书" title="返回选书">←</a>
              <h2 id="map-title" tabindex="-1">肖1000 关卡地图</h2>
            </div>
            <button id="map-motion" class="map-motion" type="button" aria-label="暂停动效" title="暂停动效"><span aria-hidden="true"></span></button>
          </header>
          <div class="map-overall">
            <div class="map-overall-summary">
              <span id="map-overall-done"></span>
              <span id="map-overall-cleared"></span>
              <span class="map-overall-stars"><span aria-hidden="true">★</span> <span id="map-overall-stars"></span></span>
            </div>
            <progress id="map-overall-bar" max="1" value="0" aria-label="全书答题进度"></progress>
          </div>
          <nav id="worlds" class="worlds" aria-label="选择科目"></nav>
        </div>
        <div id="map-preview" class="map-preview" aria-hidden="true"></div>
        <div class="map-stage-strip">
          <ol id="stage-route" class="stage-strip" aria-label="章节关卡"></ol>
        </div>
        <footer class="map-footer">
          <div class="map-selection" aria-live="polite">
            <span id="map-stop-number" class="map-stop-number" aria-hidden="true"></span>
            <div class="map-chapter-copy">
              <h3 id="map-chapter"></h3>
              <div class="map-chapter-meta">
                <p id="map-status"></p>
              </div>
            </div>
          </div>
          <div class="map-tools">
            <nav class="map-pagination" aria-label="关卡分组">
              <button id="map-prev" type="button" aria-label="上一组关卡"><span aria-hidden="true"></span></button>
              <span id="map-page"></span>
              <button id="map-next" type="button" aria-label="下一组关卡"><span aria-hidden="true"></span></button>
            </nav>
            <button id="map-continue" class="button primary" type="button"><span></span></button>
          </div>
        </footer>
      </div>
    </div>
  </section>
  <dialog id="stage-recap" class="game-dialog recap-dialog" aria-labelledby="recap-title">
    <header class="dialog-head">
      <h2 id="recap-title">关卡结算</h2>
      <button class="dialog-close" type="button" aria-label="关闭关卡结算">×</button>
    </header>
    <div class="recap-content">
      <p id="recap-chapter"></p>
      <div class="recap-award">
        <div id="recap-orbit" class="recap-orbit" aria-hidden="true"></div>
        <div id="recap-effects" class="recap-effects" aria-hidden="true"></div>
        <div id="recap-stars" class="recap-stars"></div>
      </div>
      <p id="recap-score" class="recap-score"></p>
      <p id="recap-rule"></p>
      <div class="recap-actions">
        <button id="recap-review" class="button secondary" type="button">复盘错题</button>
        <button id="recap-next" class="button primary" type="button">下一关</button>
      </div>
    </div>
  </dialog>
  <dialog id="exam-confirm" class="game-dialog exam-confirm" aria-labelledby="exam-confirm-title">
    <div class="exam-confirm-inner">
      <h2 id="exam-confirm-title"></h2>
      <p id="exam-confirm-text"></p>
      <form method="dialog" class="exam-confirm-actions">
        <button class="button secondary" value="cancel" autofocus>返回</button>
        <button class="button primary" id="exam-confirm-yes" value="confirm"></button>
      </form>
    </div>
  </dialog>
  <footer id="actions" class="actions" hidden>
    <div class="answer-sheets">
      <aside id="single-sheet" class="answer-sheet" aria-labelledby="single-sheet-title" hidden>
        <div class="answer-sheet-head">
          <h3 id="single-sheet-title">答题卡</h3>
          <select id="sheet-filter" class="answer-sheet-filter" aria-label="筛选逐题练习题目">
            <option value="all">全部</option>
            <option value="unanswered">未答</option>
            <option value="wrong">错题</option>
            <option value="marked">标记</option>
          </select>
          <div class="answer-sheet-pages" role="group" aria-label="逐题答题卡页码" hidden>
            <button type="button" aria-label="答题卡上一页">‹</button>
            <output></output>
            <button type="button" aria-label="答题卡下一页">›</button>
          </div>
        </div>
        <nav id="sheet-numbers" class="answer-sheet-numbers" aria-label="跳转逐题练习题目"></nav>
        <p id="sheet-empty" class="answer-sheet-empty" role="status" hidden></p>
        <p id="save-status" class="answer-sheet-empty" role="status" hidden></p>
      </aside>
      <aside id="exam-sheet" class="answer-sheet" aria-labelledby="exam-sheet-title" hidden>
        <div class="answer-sheet-head">
          <h3 id="exam-sheet-title">答题卡</h3>
          <button id="exam-sheet-filter" class="answer-sheet-filter" type="button" aria-pressed="false"></button>
          <div class="answer-sheet-pages" role="group" aria-label="整卷答题卡页码" hidden>
            <button type="button" aria-label="答题卡上一页">‹</button>
            <output></output>
            <button type="button" aria-label="答题卡下一页">›</button>
          </div>
        </div>
        <nav id="exam-sheet-numbers" class="answer-sheet-numbers" aria-label="跳转试卷题目"></nav>
        <p id="exam-sheet-empty" class="answer-sheet-empty" role="status" hidden></p>
      </aside>
    </div>
    <div id="single-actions" class="actions-inner">
      <button id="previous" class="button secondary" type="button">上一题</button>
      <span id="action-hint" class="action-hint"></span>
      <button id="skip" class="button secondary" type="button">跳过</button>
      <button id="retry" class="button secondary" type="button" hidden>重做本题</button>
      <button id="submit" class="button primary" type="button">提交答案</button>
      <button id="next" class="button primary" type="button" hidden>下一题</button>
    </div>
    <div id="exam-actions" class="actions-inner exam-actions" hidden>
      <span id="exam-progress" class="action-hint" role="status"></span>
      <span id="exam-storage-status" class="exam-storage-status" hidden>无法保存草稿</span>
      <button id="exam-prev" class="button secondary" type="button">上一页</button>
      <button id="exam-next" class="button secondary" type="button">下一页</button>
      <button id="exam-submit" class="button primary" type="button">交卷</button>
    </div>
  </footer>

</html>
